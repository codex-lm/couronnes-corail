  <style>:root {
  color-scheme: dark;
  --ink: #09172b;
  --ink-2: #10243f;
  --panel: rgba(16, 35, 60, 0.94);
  --panel-soft: rgba(23, 48, 77, 0.82);
  --pearl: #f3ead7;
  --pearl-dim: #c8c2b7;
  --coral: #ed7567;
  --coral-dark: #b64c4c;
  --ultramarine: #5579db;
  --aqua: #77c6ca;
  --gold: #d7b474;
  --line: rgba(213, 226, 237, 0.16);
  --shadow: 0 18px 60px rgba(2, 9, 24, 0.42);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--pearl); }
button, select { font: inherit; }
button { color: inherit; }
button:focus-visible, select:focus-visible, canvas:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
button:disabled { opacity: 0.42; cursor: not-allowed; }
[hidden] { display: none !important; }

.menu-screen {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
  background: linear-gradient(90deg, rgba(5, 15, 34, .90), rgba(5, 18, 38, .38) 58%, rgba(5, 15, 34, .68)), url('../../art/cover.png') center/cover;
}
.menu-vignette { position: absolute; inset: 0; box-shadow: inset 0 0 180px #050e20; pointer-events: none; }
.menu-card { position: relative; width: min(600px, 100%); margin-right: min(36vw, 440px); padding: 42px 46px 30px; border: 1px solid rgba(243,234,215,.22); border-radius: 3px 42px 3px 42px; background: rgba(8,24,45,.84); box-shadow: var(--shadow); backdrop-filter: blur(18px); }
.eyebrow { margin: 0 0 16px; color: var(--coral); font-size: 11px; font-weight: 750; letter-spacing: .22em; }
h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; }
.menu-card h1 { margin: 0; max-width: 520px; font-size: clamp(45px, 6vw, 78px); line-height: .92; letter-spacing: -.04em; text-wrap: balance; }
.menu-subtitle { margin: 18px 0 8px; color: var(--aqua); font-family: Georgia, serif; font-size: 20px; font-style: italic; }
.menu-tagline { max-width: 430px; color: var(--pearl-dim); line-height: 1.55; }
.menu-actions { display: grid; gap: 10px; margin-top: 28px; }
.menu-settings { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.menu-settings label { display: flex; align-items: center; gap: 10px; color: var(--pearl-dim); font-size: 13px; }
.menu-foot { margin: 22px 0 0; color: #8194ac; font-size: 10px; letter-spacing: .14em; }
.shell-mark { display: flex; align-items: end; gap: 3px; position: absolute; top: 35px; right: 42px; transform: rotate(-12deg); }
.shell-mark span { width: 12px; height: 26px; border: 2px solid var(--coral); border-radius: 100% 100% 20% 20%; }
.shell-mark span:nth-child(2) { height: 35px; }

.button, .icon-button, .tab { border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.055); cursor: pointer; transition: transform .16s, background .16s, border-color .16s; }
.button:hover, .icon-button:hover, .tab:hover { background: rgba(255,255,255,.11); border-color: rgba(243,234,215,.34); }
.button:active, .icon-button:active { transform: translateY(1px); }
.button { padding: 10px 14px; font-size: 13px; font-weight: 650; }
.button.primary { color: #162139; border-color: #f59a85; background: linear-gradient(135deg, #f59a85, var(--coral)); box-shadow: 0 8px 24px rgba(237,117,103,.18); }
.button.secondary { border-color: rgba(119,198,202,.45); background: rgba(119,198,202,.12); }
.button.ghost { background: transparent; }
.button.large { padding: 14px 18px; font-size: 15px; }
.button.compact { padding: 8px 11px; white-space: nowrap; }
.button-glyph { margin-right: 5px; color: var(--aqua); }
.icon-button { display: inline-grid; place-items: center; width: 36px; height: 36px; padding: 0; }
select { min-height: 34px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--ink-2); color: var(--pearl); }

.game { width: 100%; height: 100%; display: grid; grid-template-rows: 70px minmax(0, 1fr); }
.topbar { z-index: 5; display: flex; align-items: center; gap: 20px; padding: 9px 16px; border-bottom: 1px solid var(--line); background: #0c1d34; box-shadow: 0 6px 22px rgba(3,10,25,.28); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 176px; }
.brand-crown { display: grid; place-items: center; width: 38px; height: 38px; color: var(--coral); border: 1px solid var(--coral-dark); border-radius: 50% 50% 42% 42%; font-size: 27px; }
.brand strong { display: block; font-family: Georgia, serif; font-size: 18px; font-weight: 500; }
.brand small { color: var(--aqua); font-size: 11px; letter-spacing: .05em; }
.resource-bar { display: flex; flex: 1; justify-content: center; gap: 8px; }
.resource-chip { display: grid; grid-template-columns: 24px auto; grid-template-rows: auto auto; column-gap: 7px; min-width: 112px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.035); }
.resource-icon { grid-row: 1/3; align-self: center; width: 20px; height: 20px; border: 2px solid currentColor; }
.resource-icon.provisions { color: var(--coral); border-radius: 50% 50% 45% 10%; transform: rotate(-25deg); }
.resource-icon.materials { color: var(--gold); border-radius: 3px; transform: rotate(45deg) scale(.8); }
.resource-icon.knowledge { color: var(--aqua); border-radius: 50%; box-shadow: inset 0 0 0 4px rgba(119,198,202,.16); }
.resource-value { font-size: 16px; font-weight: 750; line-height: 1; }
.resource-net { color: #9db0c3; font-size: 10px; }

.tide-banner { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); padding: 20px 38px; border: 1px solid var(--aqua); border-radius: 50px; background: rgba(9,30,54,.93); color: var(--pearl); font-family: Georgia,serif; font-size: 30px; box-shadow: var(--shadow); pointer-events: none; animation: tide-in 2.2s both; }

.selection-title { margin: 0; font-size: 26px; line-height: 1.05; }

.modal { width: min(780px, calc(100vw - 30px)); max-height: min(820px, calc(100vh - 34px)); padding: 0; overflow: auto; border: 1px solid rgba(243,234,215,.24); border-radius: 20px; background: #10243f; color: var(--pearl); box-shadow: var(--shadow); }

.risk-note { padding: 11px 13px; border-left: 2px solid var(--coral); background: rgba(237,117,103,.08); color: #e7d8ce; font-size: 12px; }
.discovery-art { height: 140px; margin: 12px 0; border-radius: 12px; background: radial-gradient(circle,rgba(119,198,202,.18),transparent 70%); }

.toast { position: fixed; z-index: 30; left: 50%; bottom: 26px; max-width: min(500px,90vw); transform: translateX(-50%); padding: 12px 18px; border: 1px solid var(--coral); border-radius: 12px; background: #162b47; box-shadow: var(--shadow); font-size: 12px; }

@media (max-width: 1120px) {

  .icon-button { width: 32px; height: 32px; }
  .play-area { grid-template-columns: 1fr; grid-template-rows: minmax(250px,57%) minmax(0,43%); }

  .panel-scroll { padding: 12px; }
  .end-turn { margin: 7px 12px 9px; padding: 10px; }
  .tide-card { top: 8px; left: 8px; width: 182px; padding: 9px 11px; }
  .tide-name { font-size: 16px; }
  .tide-description { display: none; }
  .faction-strip { top: 8px; right: 8px; }
  .faction-chip { min-width: 0; padding: 5px 7px; }

  .map-controls { right: 8px; bottom: 8px; }

  #modal-content { padding: 22px 18px; }
  .modal h2 { font-size: 25px; }
  .stat-grid { margin: 10px 0; }
}

  .tide-card { top: 8px; }

}
